<!DOCTYPE html>
<html lang="ru">


<!-- Стили -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лучший игрок - Криштиану Роналду</title>
    <style>
        /* Ваши предыдущие стили */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* Добавляем новые стили для формы */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
        }
        
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4CAF50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            z-index: 1001;
        }


        .download-btn-container {
            text-align: center;
            margin: 20px 0;
            width: 100%;
        }

        .best-player-btn {
            /* Основные стили */
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #6e48aa 0%, #9d50bb 100%);
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Arial', sans-serif;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            
            /* Анимация при наведении */
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .best-player-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #9d50bb 0%, #6e48aa 100%);
        }

        .best-player-btn:active {
            transform: translateY(1px);
        }



        .modal-content {
        position: relative; /* Добавьте это */
        background: white;
        padding: 20px;
        border-radius: 8px;
        width: 90%;
        max-width: 500px;
        }

        /* Стили для кнопки закрытия */
        .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        color: #aaa;
        transition: 0.3s;
        }

        .close-btn:hover {
        color: #333;
        }




    </style>
</head>


<!-- Сами картиночки -->
<body>
    <div class="download-btn-container">
        <a href="messi.jpeg" download="lionel.jpeg" class="best-player-btn">
            Лучший игрок
        </a>
    </div>
    
    <div class="image-container">
        <img src="https://s-cdn.sportbox.ru/images/styles/1200-auto/fp_fotos/bd/b0/95dd9d6c42d283d22a6ef81a48f850d2657879e3a203e325196686.jpg" alt="Криштиану Роналду">
    </div>
    
    <button id="openFormBtn">Хочу быть как Криштиану</button>
    
    <!-- Модальное окно формы -->
    <div id="formModal" class="modal">
        <div class="modal-content">

            <span class="close-btn">&times;</span> <!-- Кнопка закрытия -->

            <h2>Регистрация</h2>
            <form id="registrationForm"   action="https://formspree.io/f/mgvyqrbk" 
                method="POST">
                <input type="hidden" name="_subject" value="Новая регистрация - Хочу быть как Роналду!">
                <input type="hidden" name="_language" value="ru">

                <div class="form-group">
                    <label for="lastName">Фамилия:</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                
                <div class="form-group">
                    <label for="firstName">Имя:</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                
                
                <div class="form-group">
                    <label for="middleName">Отчество:</label>
                    <input type="text" id="middleName" name="middleName" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Номер телефона:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>
    
    <!-- Сообщение об успехе -->
    <div id="successMessage" class="success-message">
        Форма успешно заполнена!
    </div>
    

        <!-- Это скрипт для отправки -->
    <script>

            // Открытие модального окна при клике на кнопку
            document.getElementById('openFormBtn').addEventListener('click', function() {
                document.getElementById('formModal').style.display = 'flex';
            });
                // Открытие формы
            document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Проверка заполнения всех полей
            const form = e.target;
            const formData = new FormData(form);
            
            // Валидация
            let isValid = true;
            form.querySelectorAll('[required]').forEach(field => {
                if (!field.value.trim()) isValid = false;
            });
            
            if (!isValid) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }
            
            // Отправка через Formspree
            fetch(form.action, {
                method: 'POST',
                body: new URLSearchParams(formData),
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/x-www-form-urlencoded',
                }
            })
            .then(response => {
                if (response.ok) {
                    // Закрываем форму
                    document.getElementById('formModal').style.display = 'none';
                    
                    // Показываем сообщение об успехе
                    const successMessage = document.getElementById('successMessage');
                    successMessage.style.display = 'block';
                    
                    // Через 1 секунду скрываем сообщение
                    setTimeout(function() {
                        successMessage.style.display = 'none';
                        form.reset(); // Очищаем форму
                    }, 1000);
                } else {
                    throw new Error('Ошибка отправки формы');
                }
            })
            .catch(error => {
                alert('Произошла ошибка: ' + error.message);
            });
        });


        // Закрытие формы при клике на крестик
        document.querySelector('.close-btn').addEventListener('click', function() {
            document.getElementById('formModal').style.display = 'none';
        });

        // Закрытие при клике вне формы
        document.getElementById('formModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        });

        // Закрытие по ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('formModal').style.display = 'none';
            }
        });
    </script>
</body>
</html>
